<style>
*{

<body>

<header>
    <h1>🤝 Join as a Volunteer</h1>
</header>

<div class="container">

    <div class="form-box">

        <h2>Volunteer Registration</h2>

        <p class="intro">
            Join us in helping people and communities during difficult times.
        </p>

        <form id="volunteerForm">

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
            >

            <label for="age">Age</label>
            <input
                type="number"
                id="age"
                name="age"
                min="18"
                placeholder="Enter your age"
                required
            >

            <label for="phone">Phone / WhatsApp</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email address"
                required
            >

            <label for="location">Location</label>
            <input
                type="text"
                id="location"
                name="location"
                placeholder="Village / Town / District"
                required
            >

            <label for="help_type">How would you like to help?</label>

            <select
                id="help_type"
                name="help_type"
                required
            >
                <option value="">Select an option</option>
                <option value="Disaster Relief">Disaster Relief</option>
                <option value="Food Distribution">Food Distribution</option>
                <option value="Community Support">Community Support</option>
                <option value="Medical Support">Medical Support</option>
                <option value="Logistics">Logistics</option>
                <option value="Other">Other</option>
            </select>

            <label for="availability">Availability</label>

            <select
                id="availability"
                name="availability"
                required
            >
                <option value="">Select availability</option>
                <option value="Weekdays">Weekdays</option>
                <option value="Weekends">Weekends</option>
                <option value="Emergency Only">Emergency Only</option>
                <option value="Flexible">Flexible</option>
            </select>

            <label for="message">Message</label>

            <textarea
                id="message"
                name="message"
                placeholder="Tell us anything else you would like us to know"
            ></textarea>

            <button id="submitBtn" type="submit">
                🤝 Submit Volunteer Request
            </button>

            <div id="formMessage" class="message"></div>

        </form>

        <a href="index.html" class="back">
            ← Back to Home
        </a>

    </div>

</div>

<footer>

    <p>© 2026 Emergency Responders</p>
    <p>A Helping Hand for Humanity ❤️</p>

</footer>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://gjfbqzwcatpvejuofdvc.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_IqsUiT2ta9ZuQh9Y3V-eGg_fUy1IIRm";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


const volunteerForm =
document.getElementById("volunteerForm");

const submitBtn =
document.getElementById("submitBtn");

const formMessage =
document.getElementById("formMessage");


volunteerForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        submitBtn.disabled = true;

        submitBtn.textContent =
            "Submitting...";


        formMessage.className =
            "message";

        formMessage.textContent =
            "";


        const volunteerData = {

            name:
                document.getElementById("name").value.trim(),

            age:
                Number(
                    document.getElementById("age").value
                ),

            phone:
                document.getElementById("phone").value.trim(),

            email:
                document.getElementById("email").value.trim(),

            location:
                document.getElementById("location").value.trim(),

            help_type:
                document.getElementById("help_type").value,

            availability:
                document.getElementById("availability").value,

            message:
                document.getElementById("message").value.trim(),

            status:
                "pending"
        };


        const { error } =
            await supabaseClient
            .from("volunteers")
            .insert([volunteerData]);


        if(error){

            console.error(
                "Volunteer submission error:",
                error
            );


            formMessage.className =
                "message error";

            formMessage.textContent =
                "❌ Submission failed. Please try again.";


            submitBtn.disabled = false;

            submitBtn.textContent =
                "🤝 Submit Volunteer Request";

            return;
        }


        formMessage.className =
            "message success";

        formMessage.textContent =
            "✅ Your volunteer request has been submitted successfully. Thank you for supporting humanity! ❤️";


        volunteerForm.reset();


        submitBtn.disabled = false;

        submitBtn.textContent =
            "🤝 Submit Volunteer Request";

    }
);

</script>

</body>
</html>
