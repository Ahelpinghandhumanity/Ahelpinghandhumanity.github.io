```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Join as Volunteer | Emergency Responders</title>

<meta name="description"
content="Join Emergency Responders as a volunteer and help people affected by emergencies and difficult situations.">

<meta name="theme-color" content="#b30000">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fa;
    color:#222;
    line-height:1.6;
}

header{
    background:#b30000;
    color:white;
    padding:18px 6%;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
}

header h1{
    font-size:28px;
}

.container{
    width:92%;
    max-width:700px;
    margin:45px auto;
}

.form-box{
    background:white;
    padding:35px 30px;
    border-radius:14px;
    box-shadow:0 3px 15px rgba(0,0,0,.12);
}

h2{
    text-align:center;
    color:#b30000;
    margin-bottom:10px;
}

.intro{
    text-align:center;
    color:#666;
    margin-bottom:28px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:17px;
    margin-bottom:6px;
}

input,
select,
textarea{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
    font-family:inherit;
}

textarea{
    min-height:110px;
    resize:vertical;
}

button{
    width:100%;
    margin-top:25px;
    padding:14px;
    background:#b30000;
    color:white;
    border:none;
    border-radius:8px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#8f0000;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#b30000;
    text-decoration:none;
    font-weight:bold;
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:25px 15px;
    margin-top:50px;
}

@media(max-width:600px){

    .container{
        width:94%;
        margin:25px auto;
    }

    .form-box{
        padding:25px 18px;
    }

    header h1{
        font-size:23px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🤝 Join as a Volunteer</h1>
</header>

<div class="container">

    <div class="form-box">

        <h2>Volunteer Registration</h2>

        <p class="intro">
            Join us in helping people and communities during difficult times.
        </p>

        <form id="volunteerForm">

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
            >

            <label for="age">Age</label>
            <input
                type="number"
                id="age"
                name="age"
                min="18"
                placeholder="Enter your age"
                required
            >

            <label for="phone">Phone / WhatsApp</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email address"
                required
            >

            <label for="location">Location</label>
            <input
                type="text"
                id="location"
                name="location"
                placeholder="Village / Town / District"
                required
            >

            <label for="help_type">How would you like to help?</label>

            <select
                id="help_type"
                name="help_type"
                required
            >
                <option value="">Select an option</option>
                <option value="Disaster Relief">Disaster Relief</option>
                <option value="Food Distribution">Food Distribution</option>
                <option value="Community Support">Community Support</option>
                <option value="Medical Support">Medical Support</option>
                <option value="Logistics">Logistics</option>
                <option value="Other">Other</option>
            </select>

            <label for="availability">Availability</label>

            <select
                id="availability"
                name="availability"
                required
            >
                <option value="">Select availability</option>
                <option value="Weekdays">Weekdays</option>
                <option value="Weekends">Weekends</option>
                <option value="Emergency Only">Emergency Only</option>
                <option value="Flexible">Flexible</option>
            </select>

            <label for="message">Message</label>

            <textarea
                id="message"
                name="message"
                placeholder="Tell us anything else you would like us to know"
            ></textarea>

            <button type="submit">
                🤝 Submit Volunteer Request
            </button>

        </form>

        <a href="index.html" class="back">
            ← Back to Home
        </a>

    </div>

</div>

<footer>

    <p>© 2026 Emergency Responders</p>
    <p>A Helping Hand for Humanity ❤️</p>

</footer>

</body>
</html>
```
