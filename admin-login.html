```html
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | Emergency Responders</title>

<meta name="theme-color" content="#b30000">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fa;
    color:#222;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

header{
    background:#b30000;
    color:white;
    text-align:center;
    padding:18px 15px;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
}

header h1{
    font-size:23px;
}

.container{
    width:92%;
    max-width:420px;
    margin:70px auto;
    flex:1;
}

.login-box{
    background:white;
    padding:30px 25px;
    border-radius:14px;
    box-shadow:0 3px 15px rgba(0,0,0,.12);
}

.login-box h2{
    text-align:center;
    color:#b30000;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#777;
    font-size:14px;
    margin-bottom:25px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#b30000;
}

button{
    width:100%;
    margin-top:22px;
    padding:13px;
    background:#b30000;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#8f0000;
}

.error{
    display:none;
    margin-top:15px;
    padding:10px;
    background:#fff0f0;
    color:#b30000;
    border-radius:7px;
    text-align:center;
    font-size:14px;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#b30000;
    text-decoration:none;
    font-weight:bold;
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:20px 10px;
    font-size:13px;
}

@media(max-width:600px){

    .container{
        margin:40px auto;
    }

    .login-box{
        padding:25px 18px;
    }

}

</style>

</head>

<body>

<header>

    <h1>🚨 Emergency Responders</h1>

</header>


<div class="container">

    <div class="login-box">

        <h2>Admin Login</h2>

        <p class="subtitle">
            Authorized access only
        </p>


        <form id="loginForm">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                required
            >


            <label
                for="password"
                style="margin-top:17px;"
            >
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >


            <button type="submit">
                🔐 Login
            </button>


            <div
                id="error"
                class="error"
            >
                ❌ Invalid username or password
            </div>

        </form>


        <a
            href="index.html"
            class="back"
        >
            ← Back to Home
        </a>

    </div>

</div>


<footer>

    <p>© 2026 Emergency Responders</p>
    <p>A Helping Hand for Humanity ❤️</p>

</footer>


<script>

document
.getElementById("loginForm")
.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        const username =
            document
            .getElementById("username")
            .value
            .trim();

        const password =
            document
            .getElementById("password")
            .value;


        /*
         * TEMPORARY LOGIN
         * We will replace this with
         * proper secure authentication.
         */

        if(
            username === "admin" &&
            password === "Admin@2026"
        ){

            window.location.href =
                "admin.html";

        }else{

            document
            .getElementById("error")
            .style.display =
                "block";

        }

    }
);

</script>

</body>
</html>
