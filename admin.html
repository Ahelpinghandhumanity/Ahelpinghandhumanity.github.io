<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel | Emergency Responders</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    color:#222;
}

header{
    background:#b30000;
    color:white;
    padding:22px 15px;
    text-align:center;
}

header h1{
    margin-bottom:5px;
}

.container{
    width:94%;
    max-width:1000px;
    margin:30px auto;
}

.card{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 15px rgba(0,0,0,.10);
    margin-bottom:25px;
}

h2{
    color:#b30000;
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:bold;
    margin:14px 0 6px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
}

button{
    border:0;
    border-radius:7px;
    padding:12px 18px;
    cursor:pointer;
    font-weight:bold;
    font-size:15px;
}

.login-btn{
    width:100%;
    margin-top:20px;
    background:#b30000;
    color:white;
}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.logout{
    float:right;
    background:#333;
    color:white;
}

.approve{
    background:#168534;
    color:white;
}

.reject{
    background:#d40000;
    color:white;
    margin-left:8px;
}

.message{
    display:none;
    margin-top:15px;
    padding:13px;
    border-radius:7px;
    word-break:break-word;
}

.success{
    background:#e7f7e7;
    color:#176b17;
}

.error{
    background:#ffe8e8;
    color:#9b0000;
}

.hidden{
    display:none !important;
}

.item{
    background:#fafafa;
    border:1px solid #ddd;
    border-radius:10px;
    padding:18px;
    margin-bottom:15px;
}

.item p{
    margin-bottom:8px;
    word-break:break-word;
}

.item strong{
    color:#b30000;
}

.item img{
    width:100%;
    max-width:420px;
    max-height:300px;
    object-fit:cover;
    border-radius:8px;
    margin:10px 0;
    display:block;
}

.actions{
    margin-top:15px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat{
    background:white;
    padding:20px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.stat h3{
    color:#b30000;
    font-size:27px;
    margin-top:6px;
}

.badge{
    display:inline-block;
    background:#fff0d9;
    color:#9a5b00;
    padding:6px 10px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
}

@media(max-width:600px){

    .container{
        width:94%;
        margin:20px auto;
    }

    .card{
        padding:18px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .approve,
    .reject{
        width:100%;
        margin:5px 0;
    }

    .logout{
        float:none;
        margin-bottom:15px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Emergency Responders</h1>
    <p>Admin Approval Panel</p>
</header>

<div class="container">

<!-- LOGIN -->

<div class="card" id="loginBox">

    <h2>🔐 Admin Login</h2>

    <form id="loginForm">

        <label for="email">Admin Email</label>

        <input
            type="email"
            id="email"
            value="roypranab198@gmail.com"
            autocomplete="username"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            autocomplete="current-password"
            required
        >

        <button
            type="submit"
            class="login-btn"
            id="loginButton"
        >
            🔐 Login
        </button>

    </form>

    <div
        id="loginMessage"
        class="message"
    ></div>

</div>


<!-- ADMIN PANEL -->

<div
    id="adminPanel"
    class="hidden"
>

    <div class="card">

        <button
            class="logout"
            onclick="logout()"
        >
            Logout
        </button>

        <h2>Admin Dashboard</h2>

        <p>
            Manage donations and relief work submissions.
        </p>

        <div
            id="panelMessage"
            class="message"
        ></div>

    </div>


    <!-- STATS -->

    <div class="stats">

        <div class="stat">
            <p>Approved Donations</p>
            <h3 id="donorCount">0</h3>
        </div>

        <div class="stat">
            <p>Total Donations</p>
            <h3 id="totalAmount">₹0</h3>
        </div>

        <div class="stat">
            <p>Pending Relief Work</p>
            <h3 id="reliefCount">0</h3>
        </div>

    </div>


    <!-- RELIEF -->

    <div class="card">

        <h2>
            📸 Pending Relief Work
        </h2>

        <span
            class="badge"
            id="reliefBadge"
        >
            0 Pending
        </span>

        <br><br>

        <div id="reliefList">
            Loading...
        </div>

    </div>


    <!-- DONATIONS -->

    <div class="card">

        <h2>
            💰 Pending Donations
        </h2>

        <div id="pendingList">
            Loading...
        </div>

    </div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://gjfbqzwcatpvejuofdvc.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_IqsUiT2ta9ZuQh9Y3V-eGg_fUy1IIRm";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


const loginForm =
document.getElementById("loginForm");

const loginButton =
document.getElementById("loginButton");

const loginMessage =
document.getElementById("loginMessage");

const loginBox =
document.getElementById("loginBox");

const adminPanel =
document.getElementById("adminPanel");


/* =========================
   LOGIN
========================= */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        const email =
            document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();

        const password =
            document
            .getElementById("password")
            .value;


        if(!email || !password){

            showLoginMessage(
                "Please enter email and password.",
                true
            );

            return;
        }


        loginButton.disabled = true;

        loginButton.textContent =
            "Signing in...";


        showLoginMessage(
            "Connecting to Supabase...",
            false
        );


        try{

            const result =
                await supabaseClient.auth
                .signInWithPassword({

                    email:email,

                    password:password

                });


            if(result.error){

                console.error(
                    "LOGIN ERROR:",
                    result.error
                );


                showLoginMessage(
                    "❌ " +
                    result.error.message,
                    true
                );


                loginButton.disabled = false;

                loginButton.textContent =
                    "🔐 Login";

                return;
            }


            if(!result.data.session){

                showLoginMessage(
                    "Login failed: no session was created.",
                    true
                );

                loginButton.disabled = false;

                loginButton.textContent =
                    "🔐 Login";

                return;
            }


            showLoginMessage(
                "✅ Login successful. Opening Admin Panel...",
                false
            );


            loginBox.classList.add(
                "hidden"
            );

            adminPanel.classList.remove(
                "hidden"
            );


            await loadData();


        }catch(error){

            console.error(
                "LOGIN EXCEPTION:",
                error
            );


            showLoginMessage(
                "❌ Connection error: " +
                error.message,
                true
            );


        }finally{

            loginButton.disabled = false;

            loginButton.textContent =
                "🔐 Login";

        }

    }
);


/* =========================
   LOAD DATA
========================= */

async function loadData(){

    await loadReliefWork();

    await loadPendingDonations();

    await loadStats();

}


/* =========================
   RELIEF WORK
========================= */

async function loadReliefWork(){

    const list =
        document.getElementById(
            "reliefList"
        );


    list.innerHTML =
        "<p>Loading relief work...</p>";


    const { data, error } =
        await supabaseClient
        .from("relief_work")
        .select("*")
        .eq("status","pending")
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            "RELIEF ERROR:",
            error
        );


        list.innerHTML =
            "<div class='message error' style='display:block'>" +
            escapeHtml(error.message) +
            "</div>";

        return;
    }


    const count =
        data ? data.length : 0;


    document.getElementById(
        "reliefCount"
    ).textContent =
        count;


    document.getElementById(
        "reliefBadge"
    ).textContent =
        count + " Pending";


    if(count === 0){

        list.innerHTML =
            "<p>No pending relief work.</p>";

        return;
    }


    list.innerHTML = "";


    data.forEach(function(item){

        const div =
            document.createElement("div");


        div.className =
            "item";


        div.innerHTML = `

            <p>
                <strong>Name / Organization:</strong>
                ${escapeHtml(item.name)}
            </p>

            <p>
                <strong>Location:</strong>
                ${escapeHtml(item.location)}
            </p>

            <p>
                <strong>Relief Work:</strong>
                ${escapeHtml(
                    item.activity ||
                    item.description ||
                    ""
                )}
            </p>

            <p>
                <strong>Status:</strong>
                ${escapeHtml(item.status)}
            </p>

            <img
                src="${escapeHtml(item.photo_url)}"
                alt="Relief work"
                loading="lazy"
            >

            <div class="actions">

                <button
                    class="approve"
                    onclick="approveRelief(${item.id})"
                >
                    ✅ Approve
                </button>

                <button
                    class="reject"
                    onclick="rejectRelief(${item.id})"
                >
                    ❌ Reject
                </button>

            </div>
        `;


        list.appendChild(div);

    });

}


/* =========================
   APPROVE RELIEF
========================= */

async function approveRelief(id){

    const { error } =
        await supabaseClient
        .from("relief_work")
        .update({

            status:"approved",

            approved_at:
                new Date().toISOString()

        })
        .eq(
            "id",
            id
        );


    if(error){

        showPanelMessage(
            "❌ Approve failed: " +
            error.message,
            true
        );

        return;
    }


    showPanelMessage(
        "✅ Relief work approved successfully.",
        false
    );


    await loadData();

}


/* =========================
   REJECT RELIEF
========================= */

async function rejectRelief(id){

    const { error } =
        await supabaseClient
        .from("relief_work")
        .update({

            status:"rejected"

        })
        .eq(
            "id",
            id
        );


    if(error){

        showPanelMessage(
            "❌ Reject failed: " +
            error.message,
            true
        );

        return;
    }


    showPanelMessage(
        "Relief work rejected.",
        false
    );


    await loadData();

}


/* =========================
   DONATIONS
========================= */

async function loadPendingDonations(){

    const list =
        document.getElementById(
            "pendingList"
        );


    list.innerHTML =
        "<p>Loading donations...</p>";


    const { data, error } =
        await supabaseClient
        .from("donations")
        .select("*")
        .eq("status","pending")
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        list.innerHTML =
            "<div class='message error' style='display:block'>" +
            escapeHtml(error.message) +
            "</div>";

        return;
    }


    if(!data || data.length === 0){

        list.innerHTML =
            "<p>No pending donations.</p>";

        return;
    }


    list.innerHTML = "";


    data.forEach(function(item){

        const div =
            document.createElement("div");


        div.className =
            "item";


        div.innerHTML = `

            <p>
                <strong>Donor:</strong>
                ${escapeHtml(
                    item.donor_name || ""
                )}
            </p>

            <p>
                <strong>Amount:</strong>
                ₹${Number(
                    item.amount || 0
                ).toLocaleString("en-IN")}
            </p>

            <p>
                <strong>Transaction ID:</strong>
                ${escapeHtml(
                    item.transaction_id || ""
                )}
            </p>

            <div class="actions">

                <button
                    class="approve"
                    onclick="approveDonation(${item.id})"
                >
                    ✅ Approve
                </button>

                <button
                    class="reject"
                    onclick="rejectDonation(${item.id})"
                >
                    ❌ Reject
                </button>

            </div>
        `;


        list.appendChild(div);

    });

}


/* =========================
   DONATION APPROVE
========================= */

async function approveDonation(id){

    const { error } =
        await supabaseClient
        .from("donations")
        .update({

            status:"approved",

            approved_at:
                new Date().toISOString()

        })
        .eq(
            "id",
            id
        );


    if(error){

        showPanelMessage(
            "❌ Approve failed: " +
            error.message,
            true
        );

        return;
    }


    showPanelMessage(
        "✅ Donation approved.",
        false
    );


    await loadData();

}


/* =========================
   DONATION REJECT
========================= */

async function rejectDonation(id){

    const { error } =
        await supabaseClient
        .from("donations")
        .update({

            status:"rejected"

        })
        .eq(
            "id",
            id
        );


    if(error){

        showPanelMessage(
            "❌ Reject failed: " +
            error.message,
            true
        );

        return;
    }


    showPanelMessage(
        "Donation rejected.",
        false
    );


    await loadData();

}


/* =========================
   STATS
========================= */

async function loadStats(){

    const { data, error } =
        await supabaseClient
        .from("donations")
        .select("amount")
        .eq(
            "status",
            "approved"
        );


    if(error){

        console.error(
            "STATS ERROR:",
            error
        );

        return;
    }


    let total = 0;


    data.forEach(function(item){

        total +=
            Number(item.amount || 0);

    });


    document.getElementById(
        "donorCount"
    ).textContent =
        data.length;


    document.getElementById(
        "totalAmount"
    ).textContent =
        "₹" +
        total.toLocaleString("en-IN");

}


/* =========================
   LOGOUT
========================= */

async function logout(){

    await supabaseClient
    .auth
    .signOut();

    location.reload();

}


/* =========================
   MESSAGES
========================= */

function showLoginMessage(
    text,
    isError
){

    loginMessage.style.display =
        "block";

    loginMessage.className =
        "message " +
        (
            isError
            ? "error"
            : "success"
        );

    loginMessage.textContent =
        text;

}


function showPanelMessage(
    text,
    isError
){

    panelMessage.style.display =
        "block";

    panelMessage.className =
        "message " +
        (
            isError
            ? "error"
            : "success"
        );

    panelMessage.textContent =
        text;

}


/* =========================
   HTML SAFETY
========================= */

function escapeHtml(text){

    const div =
        document.createElement("div");

    div.textContent =
        text == null
        ? ""
        : String(text);

    return div.innerHTML;

}

</script>

</body>
</html>
