<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel | Emergency Responders</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    color:#222;
}

header{
    background:#b30000;
    color:#fff;
    padding:22px 15px;
    text-align:center;
}

header h1{
    font-size:26px;
    margin-bottom:6px;
}

.container{
    width:94%;
    max-width:1000px;
    margin:30px auto;
}

.card{
    background:#fff;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 15px rgba(0,0,0,.10);
    margin-bottom:25px;
}

h2{
    color:#b30000;
    margin-bottom:18px;
}

label{
    display:block;
    margin:13px 0 6px;
    font-weight:bold;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
}

button{
    border:0;
    border-radius:7px;
    padding:11px 18px;
    cursor:pointer;
    font-weight:bold;
    font-size:15px;
}

.login-btn{
    width:100%;
    margin-top:18px;
    background:#b30000;
    color:#fff;
}

.logout{
    float:right;
    background:#333;
    color:#fff;
}

.approve{
    background:#168534;
    color:#fff;
}

.reject{
    background:#d40000;
    color:#fff;
    margin-left:8px;
}

.message{
    margin-top:15px;
    padding:12px;
    border-radius:7px;
    display:none;
    word-break:break-word;
}

.error{
    background:#ffe8e8;
    color:#9b0000;
}

.success{
    background:#e7f7e7;
    color:#176b17;
}

.hidden{
    display:none;
}

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat{
    background:#fff;
    padding:22px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.stat p{
    margin-bottom:8px;
}

.stat h3{
    font-size:28px;
    color:#b30000;
}

.donation{
    border:1px solid #ddd;
    border-radius:10px;
    padding:18px;
    margin-bottom:15px;
    background:#fafafa;
}

.donation p{
    margin-bottom:8px;
    word-break:break-word;
}

.donation strong{
    color:#b30000;
}

.actions{
    margin-top:15px;
}

.status{
    padding:10px;
    background:#fff7e6;
    border-radius:7px;
    margin-bottom:15px;
}

@media(max-width:600px){

    .container{
        width:94%;
        margin:20px auto;
    }

    .card{
        padding:18px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .approve,
    .reject{
        width:100%;
        margin:5px 0;
    }

    .logout{
        float:none;
        margin-bottom:15px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Emergency Responders</h1>
    <p>Admin Approval Panel</p>
</header>


<div class="container">

<!-- LOGIN -->

<div class="card" id="loginBox">

    <h2>Admin Login</h2>

    <form id="loginForm">

        <label for="email">Email</label>

        <input
            type="email"
            id="email"
            value="proy2953@gmail.com"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            required
        >

        <button
            type="submit"
            class="login-btn"
        >
            Login
        </button>

    </form>

    <div
        id="loginMessage"
        class="message"
    ></div>

</div>


<!-- ADMIN PANEL -->

<div
    id="adminPanel"
    class="hidden"
>

    <div class="card">

        <button
            class="logout"
            onclick="logout()"
        >
            Logout
        </button>

        <h2>Donation Management</h2>

        <p>
            Review and approve pending donation submissions.
        </p>

        <div
            id="panelMessage"
            class="message"
        ></div>

    </div>


    <!-- STATS -->

    <div class="stats">

        <div class="stat">

            <p>Verified Donors</p>

            <h3 id="donorCount">0</h3>

        </div>

        <div class="stat">

            <p>Total Donations</p>

            <h3 id="totalAmount">₹0</h3>

        </div>

    </div>


    <!-- PENDING DONATIONS -->

    <div class="card">

        <h2>Pending Donations</h2>

        <div
            id="pendingList"
        >
            Loading...
        </div>

    </div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://gjfbqzwcatpvejuofdvc.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_IqsUiT2ta9ZuQh9Y3V-eGg_fUy1IIRm";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


const loginForm =
document.getElementById("loginForm");

const loginBox =
document.getElementById("loginBox");

const adminPanel =
document.getElementById("adminPanel");

const loginMessage =
document.getElementById("loginMessage");

const panelMessage =
document.getElementById("panelMessage");


/* LOGIN */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;


        showLoginMessage(
            "Signing in...",
            false
        );


        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });


        if(error){

            showLoginMessage(
                "Login failed: " + error.message,
                true
            );

            return;
        }


        loginBox.classList.add("hidden");

        adminPanel.classList.remove("hidden");

        await loadData();

    }
);


/* LOAD ALL DATA */

async function loadData(){

    await loadPending();

    await loadStats();

}


/* LOAD PENDING DONATIONS */

async function loadPending(){

    const list =
        document.getElementById("pendingList");


    list.innerHTML =
        "<p>Loading...</p>";


    const { data, error } =
        await supabaseClient
        .from("donations")
        .select("*")
        .eq("status","pending")
        .order("created_at",{
            ascending:false
        });


    if(error){

        list.innerHTML =
            "<div class='message error' style='display:block'>" +
            "Database error: " +
            escapeHtml(error.message) +
            "</div>";

        console.error(
            "Pending donations error:",
            error
        );

        return;
    }


    if(!data || data.length === 0){

        list.innerHTML =
            "<p>No pending donations.</p>";

        return;
    }


    list.innerHTML = "";


    data.forEach(function(donation){

        const div =
            document.createElement("div");

        div.className =
            "donation";


        div.innerHTML = `

            <p>
                <strong>Donor:</strong>
                ${escapeHtml(donation.donor_name)}
            </p>

            <p>
                <strong>Amount:</strong>
                ₹${Number(donation.amount).toLocaleString("en-IN")}
            </p>

            <p>
                <strong>Transaction ID:</strong>
                ${escapeHtml(donation.transaction_id)}
            </p>

            <p>
                <strong>Anonymous:</strong>
                ${donation.anonymous ? "Yes" : "No"}
            </p>

            <p>
                <strong>Submitted:</strong>
                ${new Date(
                    donation.created_at
                ).toLocaleString()}
            </p>

            <div class="actions">

                <button
                    class="approve"
                    onclick="approveDonation(${donation.id})"
                >
                    Approve
                </button>

                <button
                    class="reject"
                    onclick="rejectDonation(${donation.id})"
                >
                    Reject
                </button>

            </div>
        `;


        list.appendChild(div);

    });

}


/* APPROVE */

async function approveDonation(id){

    const { error } =
        await supabaseClient
        .from("donations")
        .update({
            status:"approved",
            approved_at:new Date().toISOString()
        })
        .eq("id",id);


    if(error){

        showPanelMessage(
            "Approve failed: " +
            error.message
        );

        return;
    }


    showPanelMessage(
        "Donation approved successfully."
    );


    await loadData();

}


/* REJECT */

async function rejectDonation(id){

    const { error } =
        await supabaseClient
        .from("donations")
        .update({
            status:"rejected"
        })
        .eq("id",id);


    if(error){

        showPanelMessage(
            "Reject failed: " +
            error.message
        );

        return;
    }


    showPanelMessage(
        "Donation rejected."
    );


    await loadData();

}


/* STATS */

async function loadStats(){

    const { data, error } =
        await supabaseClient
        .from("donations")
        .select("amount")
        .eq("status","approved");


    if(error){

        console.error(
            "Stats error:",
            error
        );

        return;
    }


    let total = 0;

    let count = 0;


    data.forEach(function(item){

        count++;

        total += Number(item.amount);

    });


    document.getElementById(
        "donorCount"
    ).textContent = count;


    document.getElementById(
        "totalAmount"
    ).textContent =
        "₹" +
        total.toLocaleString("en-IN");

}


/* LOGOUT */

async function logout(){

    await supabaseClient.auth.signOut();

    location.reload();

}


/* MESSAGES */

function showLoginMessage(text,isError){

    loginMessage.style.display =
        "block";

    loginMessage.className =
        "message " +
        (isError ? "error" : "success");

    loginMessage.textContent =
        text;

}


function showPanelMessage(text){

    panelMessage.style.display =
        "block";

    panelMessage.className =
        "message success";

    panelMessage.textContent =
        text;

}


/* HTML SAFETY */

function escapeHtml(text){

    const div =
        document.createElement("div");

    div.textContent =
        text == null ? "" : String(text);

    return div.innerHTML;

}

</script>

</body>
</html>
