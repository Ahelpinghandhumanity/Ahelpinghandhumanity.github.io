<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Report Relief Work | Emergency Responders</title>

<meta name="description"
content="Share information about relief activities and community support work with Emergency Responders.">

<meta name="theme-color" content="#b30000">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fa;
    color:#222;
    line-height:1.6;
}

header{
    background:#b30000;
    color:white;
    padding:20px 15px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
}

header h1{
    font-size:26px;
}

.container{
    width:92%;
    max-width:700px;
    margin:40px auto;
}

.form-box{
    background:white;
    padding:35px 30px;
    border-radius:14px;
    box-shadow:0 3px 15px rgba(0,0,0,.12);
}

h2{
    text-align:center;
    color:#b30000;
    margin-bottom:10px;
}

.intro{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:17px;
    margin-bottom:6px;
}

input,
select,
textarea{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
    font-family:inherit;
}

textarea{
    min-height:120px;
    resize:vertical;
}

input[type="file"]{
    background:#fafafa;
    padding:11px;
}

.photo-note{
    font-size:13px;
    color:#777;
    margin-top:6px;
}

button{
    width:100%;
    margin-top:25px;
    padding:14px;
    background:#b30000;
    color:white;
    border:none;
    border-radius:8px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#8f0000;
}

button:disabled{
    background:#888;
    cursor:not-allowed;
}

.message{
    display:none;
    margin-top:20px;
    padding:14px;
    border-radius:8px;
    text-align:center;
    font-weight:bold;
}

.success{
    display:block;
    background:#e7f7e7;
    color:#176b17;
}

.error{
    display:block;
    background:#ffe8e8;
    color:#9b0000;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#b30000;
    text-decoration:none;
    font-weight:bold;
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:25px 15px;
    margin-top:50px;
}

footer p{
    margin:4px 0;
}

@media(max-width:600px){

    .container{
        width:94%;
        margin:25px auto;
    }

    .form-box{
        padding:25px 18px;
    }

    header h1{
        font-size:22px;
    }

}

</style>

</head>

<body>


<header>

    <h1>📸 Report Relief Work</h1>

</header>


<div class="container">

    <div class="form-box">

        <h2>Relief Work Report</h2>

        <p class="intro">
            Share information about relief activities
            and community support work.
        </p>


        <form id="reliefForm">


            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >


            <label for="phone">
                Phone / WhatsApp
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter your phone number"
                required
            >


            <label for="location">
                Relief Work Location
            </label>

            <input
                type="text"
                id="location"
                placeholder="Village / Town / District"
                required
            >


            <label for="work_date">
                Relief Work Date
            </label>

            <input
                type="date"
                id="work_date"
                required
            >


            <label for="work_type">
                Type of Relief Work
            </label>

            <select
                id="work_type"
                required
            >

                <option value="">
                    Select an option
                </option>

                <option value="Food Distribution">
                    🍚 Food Distribution
                </option>

                <option value="Flood Relief">
                    🌊 Flood Relief
                </option>

                <option value="Emergency Assistance">
                    🆘 Emergency Assistance
                </option>

                <option value="Community Support">
                    🤝 Community Support
                </option>

                <option value="Essential Supplies">
                    📦 Essential Supplies
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                placeholder="Describe the relief work..."
                required
            ></textarea>


            <label for="photo">
                📷 Upload Relief Work Photo
            </label>

            <input
                type="file"
                id="photo"
                accept="image/jpeg,image/png,image/webp"
                required
            >

            <p class="photo-note">
                Please upload a clear photo of the relief activity.
                Avoid sharing sensitive personal information.
            </p>


            <button
                type="submit"
                id="submitBtn"
            >
                📸 Submit Relief Work Report
            </button>


            <div
                id="message"
                class="message"
            ></div>


        </form>


        <a
            href="index.html"
            class="back"
        >
            ← Back to Home
        </a>

    </div>

</div>


<footer>

    <p>
        © 2026 Emergency Responders
    </p>

    <p>
        A Helping Hand for Humanity ❤️
    </p>

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://gjfbqzwcatpvejuofdvc.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_IqsUiT2ta9ZuQh9Y3V-eGg_fUy1IIRm";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


const form =
document.getElementById("reliefForm");

const message =
document.getElementById("message");

const submitBtn =
document.getElementById("submitBtn");


form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        submitBtn.disabled = true;

        submitBtn.textContent =
            "Uploading...";

        message.className =
            "message";

        message.style.display =
            "none";


        const name =
            document.getElementById("name").value.trim();

        const phone =
            document.getElementById("phone").value.trim();

        const location =
            document.getElementById("location").value.trim();

        const workDate =
            document.getElementById("work_date").value;

        const workType =
            document.getElementById("work_type").value;

        const description =
            document.getElementById("description").value.trim();

        const photo =
            document.getElementById("photo").files[0];


        if(!photo){

            showMessage(
                "Please select a photo.",
                true
            );

            submitBtn.disabled = false;

            submitBtn.textContent =
                "📸 Submit Relief Work Report";

            return;
        }


        const allowedTypes = [
            "image/jpeg",
            "image/png",
            "image/webp"
        ];


        if(!allowedTypes.includes(photo.type)){

            showMessage(
                "Please upload JPG, PNG or WebP image.",
                true
            );

            submitBtn.disabled = false;

            submitBtn.textContent =
                "📸 Submit Relief Work Report";

            return;
        }


        if(photo.size > 5 * 1024 * 1024){

            showMessage(
                "Photo must be smaller than 5 MB.",
                true
            );

            submitBtn.disabled = false;

            submitBtn.textContent =
                "📸 Submit Relief Work Report";

            return;
        }


        try{


            /* ================= PHOTO UPLOAD ================= */

            submitBtn.textContent =
                "Uploading photo...";


            const extension =
                photo.name.split(".").pop();


            const fileName =
                Date.now() +
                "-" +
                Math.random()
                    .toString(36)
                    .substring(2) +
                "." +
                extension;


            const filePath =
                "relief/" +
                fileName;


            const upload =
                await supabaseClient
                .storage
                .from("relief-work")
                .upload(
                    filePath,
                    photo,
                    {
                        cacheControl:"3600",
                        upsert:false,
                        contentType:photo.type
                    }
                );


            if(upload.error){

                throw upload.error;

            }


            /* ================= PHOTO URL ================= */

            const publicUrl =
                supabaseClient
                .storage
                .from("relief-work")
                .getPublicUrl(filePath);


            const photoUrl =
                publicUrl.data.publicUrl;


            /* ================= SAVE REPORT ================= */

            submitBtn.textContent =
                "Submitting report...";


            const { error } =
                await supabaseClient
                .from("relief_reports")
                .insert({

                    name:name,

                    phone:phone,

                    location:location,

                    work_date:workDate,

                    work_type:workType,

                    description:description,

                    photo_url:photoUrl,

                    status:"pending"

                });


            if(error){

                throw error;

            }


            /* ================= SUCCESS ================= */

            form.reset();

            showMessage(
                "✅ Thank you! Your relief work report has been submitted successfully. ❤️",
                false
            );


        }catch(error){

            console.error(
                "Relief report error:",
                error
            );

            showMessage(
                "❌ Submission failed. Please try again.",
                true
            );

        }


        submitBtn.disabled = false;

        submitBtn.textContent =
            "📸 Submit Relief Work Report";

    }
);


function showMessage(text,isError){

    message.textContent =
        text;

    message.className =
        "message " +
        (isError ? "error" : "success");

    message.style.display =
        "block";

}

</script>


</body>
</html>
