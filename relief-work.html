<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Share Relief Work | Emergency Responders</title>

<meta name="description"
content="Share relief work activities with Emergency Responders.">

<meta name="theme-color" content="#b30000">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fa;
    color:#222;
    line-height:1.6;
}

header{
    background:#b30000;
    color:white;
    padding:20px 15px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
}

header h1{
    font-size:27px;
}

.container{
    width:92%;
    max-width:700px;
    margin:40px auto;
}

.form-box{
    background:white;
    padding:30px;
    border-radius:14px;
    box-shadow:0 3px 15px rgba(0,0,0,.12);
}

h2{
    text-align:center;
    color:#b30000;
    margin-bottom:10px;
}

.intro{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:16px;
    margin-bottom:6px;
}

input,
textarea{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
    font-family:inherit;
}

textarea{
    min-height:120px;
    resize:vertical;
}

button{
    width:100%;
    margin-top:24px;
    padding:14px;
    background:#b30000;
    color:white;
    border:0;
    border-radius:8px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#8f0000;
}

.message{
    display:none;
    margin-top:18px;
    padding:12px;
    border-radius:7px;
    text-align:center;
}

.success{
    display:block;
    background:#e7f7e7;
    color:#176b17;
}

.error{
    display:block;
    background:#ffe8e8;
    color:#9b0000;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#b30000;
    text-decoration:none;
    font-weight:bold;
}

.note{
    margin-top:18px;
    padding:12px;
    background:#fff7e6;
    border-radius:8px;
    color:#665000;
    font-size:14px;
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:25px 15px;
    margin-top:50px;
}

footer p{
    margin:4px 0;
}

@media(max-width:600px){

    .container{
        width:94%;
        margin:25px auto;
    }

    .form-box{
        padding:22px 17px;
    }

    header h1{
        font-size:23px;
    }

}

</style>
</head>

<body>

<header>

    <h1>📸 Share Relief Work</h1>

</header>


<div class="container">

    <div class="form-box">

        <h2>Relief Work Report</h2>

        <p class="intro">
            Share information about relief activities
            and community support work.
        </p>


        <form id="reliefForm">

            <label for="name">
                Your Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >


            <label for="location">
                Location
            </label>

            <input
                type="text"
                id="location"
                placeholder="Village / Town / District"
                required
            >


            <label for="activity">
                Relief Activity
            </label>

            <textarea
                id="activity"
                placeholder="Describe the relief work..."
                required
            ></textarea>


            <label for="photo">
                📷 Upload Photo
            </label>

            <input
                type="file"
                id="photo"
                accept="image/jpeg,image/png,image/webp"
                required
            >


            <div class="note">
                Please do not upload sensitive personal information
                or private documents in the photo.
            </div>


            <button type="submit">
                📸 Submit Relief Work Report
            </button>

        </form>


        <div id="message" class="message"></div>


        <a href="index.html" class="back">
            ← Back to Home
        </a>

    </div>

</div>


<footer>

    <p>© 2026 Emergency Responders</p>

    <p>
        A Helping Hand for Humanity ❤️
    </p>

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://gjfbqzwcatpvejuofdvc.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_IqsUiT2ta9ZuQh9Y3V-eGg_fUy1IIRm";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


const form =
document.getElementById("reliefForm");

const message =
document.getElementById("message");


form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        message.className = "message";
        message.textContent = "Submitting...";
        message.style.display = "block";


        const name =
            document.getElementById("name").value.trim();

        const location =
            document.getElementById("location").value.trim();

        const activity =
            document.getElementById("activity").value.trim();

        const photo =
            document.getElementById("photo").files[0];


        if(!photo){

            showMessage(
                "Please select a photo.",
                true
            );

            return;
        }


        if(photo.size > 5 * 1024 * 1024){

            showMessage(
                "Photo must be smaller than 5 MB.",
                true
            );

            return;
        }


        try{

            /* UNIQUE FILE NAME */

            const fileName =
                Date.now() +
                "_" +
                Math.random()
                    .toString(36)
                    .substring(2) +
                "_" +
                photo.name.replace(
                    /[^a-zA-Z0-9._-]/g,
                    "_"
                );


            /* UPLOAD PHOTO */

            const { error: uploadError } =
                await supabaseClient
                .storage
                .from("relief-work")
                .upload(
                    fileName,
                    photo,
                    {
                        contentType:photo.type,
                        upsert:false
                    }
                );


            if(uploadError){

                throw uploadError;

            }


            /* GET PUBLIC PHOTO URL */

            const { data:publicData } =
                supabaseClient
                .storage
                .from("relief-work")
                .getPublicUrl(fileName);


            const photoUrl =
                publicData.publicUrl;


            /* SAVE REPORT */

            const { error:insertError } =
                await supabaseClient
                .from("relief_work")
                .insert({

                    name:name,

                    location:location,

                    activity:activity,

                    photo_url:photoUrl,

                    status:"pending"

                });


            if(insertError){

                throw insertError;

            }


            form.reset();


            showMessage(
                "✅ Thank you! Your relief work report has been submitted successfully. It will appear publicly after admin approval. ❤️",
                false
            );


        }catch(error){

            console.error(
                "Relief submission error:",
                error
            );


            showMessage(
                "❌ Submission failed. Please try again.",
                true
            );

        }

    }
);


function showMessage(
    text,
    isError
){

    message.style.display = "block";

    message.className =
        "message " +
        (isError ? "error" : "success");

    message.textContent = text;

}

</script>

</body>
</html>
